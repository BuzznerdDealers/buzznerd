name: Deploy

# Deploy rules (read carefully):
#   - Pushes to `main`            -> PRODUCTION deploy (custom domain). Only merges land here.
#   - Pushes to any other branch  -> PREVIEW deploy (isolated URL, never touches prod).
#   - Pull requests               -> PREVIEW deploy for review.
# main is protected: no direct pushes. Production only changes when a PR is merged.

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The build must pass before any deploy. Broken content (invalid schema,
      # missing required frontmatter) fails here and never reaches a URL.
      - name: Build
        run: npm run build

      # PRODUCTION — only on merges to main.
      - name: Deploy to production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy

      # PREVIEW — every other branch/PR. Uploads a new version with a unique
      # preview URL without promoting it to production.
      - name: Upload preview version
        if: "!(github.event_name == 'push' && github.ref == 'refs/heads/main')"
        run: npx wrangler versions upload
